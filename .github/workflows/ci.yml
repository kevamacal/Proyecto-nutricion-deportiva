name: CI

on: 
    pull_request:
        branches: [ "main" ]
    push: 
        branches: [ "main" ]
    workflow_dispatch:

jobs: 
  lint: 
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run : |
          pip install ruff mypy pytest
      - name: Lint & Format check
        run : |
          ruff check src/
          ruff format --check src/
      - name: Type check
        run : |
          mypy src/backend
      - name: Tests
        run : |
          pytest 