[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["langgraph.*", "supabase", "supabase.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008"]


[tool.pytest.ini_options]
pythonpath = ["."]
